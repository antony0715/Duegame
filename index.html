<!--
  ★★★ 新增內容前必讀（物品 / 裝備 / 建築 / 電器 / 載具 / 動物 …）★★★
  每新增一樣東西，下面 6 項都要逐項確認；漏掉就會出現「存檔掉資料、多人看不到、模型消失、分類錯亂」。
  開瀏覽器主控台（F12）會自動跑 [J57] 自檢；也可隨時手動輸入 __CHK()，缺漏會用 console.warn 列出（只能檢查 1、2、3、5、6 的靜態部分，多人同步 4 要人工確認）。

  【1. 物品資料與分類】
    - 名稱 NX / PN、說明 DS / DX、SVG 圖示 IC[k]（沒有圖示的物品不會顯示）。
    - 可堆疊素材：inv[k]=0，並把 k 加進 RES（[J16]），否則拿到了背包也看不到。
    - 不可堆疊（工具 / 武器 / 護甲）：寫進 IT[k]，並把 k 加進 KEYS；有耐久就加 MD[k]。
    - 配方：RC.push([k, 名稱, {材料}, 工作臺等級, 一次產量])。分類：CT[k]=分類索引，順序依 CI / CIN
      （工具0 武器1 防具2 設施3 材料4 醫療5 電力6 …）；新增分類時 CI、CIN、__RBC 要一起改。ctg() 用 CT 決定它出現在哪一頁。
  【2. 裝備（穿戴）】 搜尋 [EQ]
    - 只有拖曳到「人物旁邊的裝備格 EQP」才算穿上，不佔背包格。IT[k].ar（減傷）>0 預設放「身體」格；
      要新部位（頭 / 腿 …）：EQS 加一筆 {id,n,ic}，物品寫 IT[k].eq='該格id'。
    - 現有裝備格：身體（護甲）、左手（火把類）。判斷能不能放：eqFit(k,格id)；「必須穿著才生效」的裝備：eqOnly(k)。
    - 左手：IT[k].lh=1 的物品可以拿在左手（不佔背包格、不用選在快捷欄就生效）。要發光 / 燃燒 / 手持模型，看 [J57b]（wearL、lhM、tl2）。
    - 生效判斷一律用 own[k]（syncSlots 已區分穿著 / 在背包），不要直接讀 SLOTS。
    - 已處理好的流程：存檔 snap().eqm（格子id→物品）/ personal()、舊存檔轉換 eqMigrate、死亡掉落 dropAll、重生清空、拖曳 eqPut / eqOff / dropOut。
    - 耐久（DUR）以物品 key 共用，換位置不會重置（mkC / pickDrop / dropOut 已處理）。
    - 目前左手火把只有自己看得到；若新裝備要讓其他玩家看到：把裝備 key 加進玩家在線封包（[J51]），並在 [J54] 顯示模型。
  【3. 存檔】 snap()（寫）/ personal()（個人：背包、裝備、血量）/ world()（世界：建築、電線、開關、地上物）
    - 新欄位一律用「新的鍵名」，不要與既有鍵重複（曾因 pl 寫了兩次，血量 / 飢餓 / 口渴存不到；放置物現在叫 po）。
    - 讀檔必須容忍舊存檔沒有該欄位（給預設值 / 做轉換）。
    - 世界欄位要同時加進 world()（還原）與 wp()（多人載入時廣播給其他玩家），否則其他玩家那邊會被清空。
    - 放置的建築 / 電器放在 dps；要存的屬性（fu / hp / sw0 …）要在 snap 的 dps 迴圈與 world 的還原迴圈各寫一次。
  【4. 多人同步】
    - 一律 nt(事件名, 資料) 廣播，NET.on(事件名, …) 接收，接收端要略過 m.isMe。事件名先全檔搜尋 nt(' 確認沒重複。
    - 新玩家加入時（NET.onPeers）要補送一次完整狀態；只有房主（HOST）跑的模擬（炮台、動物）結果要廣播。
    - 玩家個人狀態（背包、裝備、血量）不需同步；世界狀態（建築、電線、開關、燃料、彈藥、電量）都要同步 + 存檔。
  【5. 3D 模型】
    - 建築 / 設施：NP[k](g,add,B,WM,WD,WS)，k 加入 NEWK / DK / PK，血量 DHP[k]、腐朽 DD[k] / DM[k]。
    - 手持：IT[k].v + parts(k)；載具：mkM(k)；動物：mkX。
    - 載具第三人稱鏡頭在 [J57c]：新載具要在 FACE（鏡頭距離）、SEATH（坐姿高度）、DRVOFF（駕駛座位置）各加一筆，否則用預設值。模型只用 T3.Group + Mesh（材質 LB(色碼)），不載外部檔案。
  【6. 電器】 搜尋 [J36]、[J37]、[J57]
    - 加進 PWK（電網成員）、AH[k]（電線接點高度）、DW0[k]（耗電單位；發電設備不填）；要能開關就加 SWK（自動存檔 + 同步）。
    - 每個電器都有「操作面板」（瞄準後按互動鍵）：PWK 內的設備會自動有通用面板；
      要顯示專屬數值 / 按鈕就 DEVPANEL.reg(k, {rows, acts, note})（寫法見 [J57] 檔頭說明）。
    - 電網運算 pwSim 會把每個設備所在電網的供電 gs、用電 gd、含電池 ge 寫在設備物件上，面板直接讀取。
  ---------------------------------------------------------------
-->

 try{

o.push(row('殭屍王','特殊事件出現的頭目，體型巨大','生命 1200・攻擊 30・破壞力極強'));

return o.join('')}
function tabBuild(){const pcs=[...SK,...BPK],o=[sec('材質等級','<p>草房 → 木頭 → 石頭 → 金屬 → 裝甲。等級越高耐久越高，維護所需材料依序為：草、木頭、石頭、金屬碎片、高品質金屬。</p>')];
for(const k of pcs){if(!PN[k]&&!NX[k])continue;let h='';try{h=[0,1,2,3,4].map(t=>['草房','木頭','石頭','金屬','裝甲'][t]+' '+mxh(k,t)).join('／')}catch(e){}
let c='';try{const b=bc(k);c='建造：'+costTxt(b)}catch(e){}
o.push(`<div class=it><div class=ic>${icn(k,34)}</div><div class=tx><b>${E(PN[k]||NX[k])}</b><p>${E(DS[k]||DX[k]||'建築結構，用建築圖紙放置')}</p><small>${E(c)}</small>${h?`<small>耐久：${E(h)}</small>`:''}</div></div>`)}
if(window.NEWDEF)for(const k in NEWDEF){const d=NEWDEF[k];if(d.t!='d')continue;o.push(`<div class=it><div class=ic>${icn(k,34)}</div><div class=tx><b>${E(d.n)}</b><p>${E(d.d)}</p><small>${E('建造：'+costTxt(d.c)+'・'+(d.b>0?'需要工作臺 '+d.b+' 級':'隨身製作'))}</small><small>${E('耐久 '+d.hp+'・'+d.s)}</small></div></div>`)}
return o.join('')}
function renderRB(){if(!rb)return;const T=['玩法','物品','生物','建築'];let bar='',body='';
if(tab==0)body=tabPlay();else if(tab==1){const r=tabItems();bar=r.bar;body=r.body}else if(tab==2)body=tabMobs();else body=tabBuild();
const sc=rb.querySelector('.rb'),st=sc?sc.scrollTop:0;
rb.innerHTML=`<div class=rh><h2>規則書</h2><div class=rx data-x=1>✕</div></div><div class=rt>${T.map((t,i)=>`<div class="${i==tab?'on':''}" data-t=${i}>${t}</div>`).join('')}</div>${bar}<div class=rb>${body}</div>`;
if(sc&&rb.dataset.keep)rb.querySelector('.rb').scrollTop=st;rb.dataset.keep=''}
function openRB(){if(!rb){rb=mk('rb','f u hid','');rb.addEventListener('click',e=>{const t=e.target.closest('[data-x],[data-t],[data-f]');if(!t)return;const D=t.dataset;if(D.x)return closeRB();if(D.t!==undefined){tab=+D.t;rb.dataset.keep=''}if(D.f!==undefined){flt=+D.f;rb.dataset.keep=''}renderRB()})}
hold();renderRB();rb.classList.remove('hid')}
function closeRB(){if(rb)rb.classList.add('hid');free()}

/* ---------------- 按鍵位置自訂 ---------------- */
const ED=['bA','bJ','bC','bE','bO','bF','lc','svb'],LSK='wl_ui_pos_v1';
let pos={},editing=false,drag=null,ep=null;
try{pos=JSON.parse(localStorage.getItem(LSK)||'{}')||{}}catch(e){pos={}}
const sizeOf=el=>{const r=el.getBoundingClientRect();return[r.width||62,r.height||62]};
function put(id,fx,fy){const el=$(id);if(!el||!(fx>=0)||!(fy>=0))return;const[w,h]=sizeOf(el),x=Math.max(0,Math.min(innerWidth-w,fx*innerWidth)),y=Math.max(0,Math.min(innerHeight-h,fy*innerHeight)),s=el.style;s.setProperty('left',x+'px','important');s.setProperty('top',y+'px','important');s.setProperty('right','auto','important');s.setProperty('bottom','auto','important')}
const applyAll=()=>{for(const id of ED)if(pos[id])put(id,pos[id][0],pos[id][1])};
const persist=()=>{try{localStorage.setItem(LSK,JSON.stringify(pos))}catch(e){}};
function resetAll(){pos={};try{localStorage.removeItem(LSK)}catch(e){}for(const id of ED){const el=$(id);if(el)for(const p of['left','top','right','bottom'])el.style.removeProperty(p)}}
const elOf=t=>{for(const id of ED){const e=$(id);if(e&&e.contains(t))return e}return null};
const ok=t=>t&&t.closest&&t.closest('.edok');
const eat=e=>{e.stopImmediatePropagation();e.stopPropagation()};
function down(e){if(!editing||ok(e.target))return;eat(e);if(e.cancelable)e.preventDefault();const p=e.changedTouches?e.changedTouches[0]:e,el=elOf(e.target);if(el&&!drag){const r=el.getBoundingClientRect();drag={el,id:e.changedTouches?p.identifier:'m',ox:p.clientX-r.left,oy:p.clientY-r.top}}}
function move(e){if(!editing)return;if(!ok(e.target)){eat(e);if(e.cancelable)e.preventDefault()}if(!drag)return;let p=null;if(e.changedTouches){for(const t of e.changedTouches)if(t.identifier===drag.id)p=t}else if(drag.id=='m')p=e;if(!p)return;const el=drag.el;pos[el.id]=[Math.max(0,p.clientX-drag.ox)/innerWidth,Math.max(0,p.clientY-drag.oy)/innerHeight];put(el.id,pos[el.id][0],pos[el.id][1]);const r=el.getBoundingClientRect();pos[el.id]=[r.left/innerWidth,r.top/innerHeight]}
function up(e){if(!editing)return;if(!ok(e.target)){eat(e);if(e.cancelable)e.preventDefault()}if(!drag)return;if(e.changedTouches){let hit=false;for(const t of e.changedTouches)if(t.identifier===drag.id)hit=true;if(!hit)return}drag=null;persist()}
const blk=e=>{if(editing&&!ok(e.target)){eat(e);if(e.cancelable)e.preventDefault()}};
for(const[t,f]of[['touchstart',down],['mousedown',down],['touchmove',move],['mousemove',move],['touchend',up],['touchcancel',up],['mouseup',up],['click',blk],['contextmenu',blk],['dblclick',blk]])window.addEventListener(t,f,{capture:true,passive:false});
function openEdit(){if(editing)return;if(!ep){ep=mk('ep','f u edok hid','<span>拖曳虛線框內的按鈕，放到想要的位置</span><div class="eb" data-a=r>還原預設</div><div class="eb pri" data-a=d>完成</div>');ep.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.dataset.a=='r')resetAll();else closeEdit()})}
hold();editing=true;drag=null;document.body.classList.add('ed');ep.classList.remove('hid')}
function closeEdit(){editing=false;drag=null;document.body.classList.remove('ed');if(ep)ep.classList.add('hid');persist();free()}
addEventListener('resize',applyAll);addEventListener('orientationchange',()=>setTimeout(applyAll,250));
applyAll();
})();

<script>
// ==================================================================
// [J57] 電器操作面板 DEVPANEL、新增內容自檢 __CHK
//        裝備格邏輯不在這裡：搜尋 [EQ]（[J16] EQS/EQP/syncSlots、[J26] eqPut/eqOff/tapEq、[J27] chH 畫格子）
//        新增電器：加進 PWK / AH / DW0 / SWK 後面板會自動出現；要自訂細節與按鈕 → DEVPANEL.reg(key,{rows,acts,note})
//          rows(d) → [[標籤,文字,0~1進度條(可省略)],...]    acts(d) → [{id,t,s,dis,cls,run},...]    note → 一行說明
// ==================================================================
(()=>{'use strict';
const Q=id=>document.getElementById(id);
const PW=window.__PW;
const f1=v=>(Math.round((+v||0)*10)/10).toFixed(1),
  esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
  nm=k=>PN[k]||NAME(k)||k;
const HAS=!!(PW&&PW.lks&&PW.pickDev&&PW.toggleSw&&PW.delLK&&PW.deg&&PW.SWK);
if(!HAS)console.warn('[J57] 找不到電網介面 __PW，電器面板停用');

// ---------- 基本判斷 ----------
const AKf=()=>window.__AK||{},
  J5=()=>window.__J55||{},
  TDf=()=>J5().TD||{},
  BC=()=>J5().BCAP||600,
  BRt=()=>J5().BR||8;
const W0=k=>k=='lamp'?1:k=='purif'?2:((PW&&PW.DW0&&PW.DW0[k])||0),
  isSw=k=>!!PW&&PW.SWK.includes(k),
  isDemand=k=>W0(k)>0,
  devKeys=()=>PW?[...new Set([...PW.PWK,'tur1'])]:[],
  isDev=d=>!!d&&devKeys().includes(d.k);

// ---------- 狀態文字 ----------
function stateOf(m){const k=m.k,T=TDf()[k];
  if(isSw(k)&&m.sw0)return['已關閉','off'];
  if(T&&T.am&&!(m.fu>0))return['沒有彈藥','bad'];
  if(k=='wind'||k=='solar')return(m.pw||0)>.05?['發電中','ok']:['未發電','warn'];
  if(k=='gen')return(m.pw||0)>0?['發電中','ok']:(m.fu>0?['待機','off']:['沒有燃料','bad']);
  if(k=='pbox')return['配電中','ok'];
  if(k=='bat')return(m.fu||0)>.5?['有電量','ok']:['電量耗盡','bad'];
  if(isDemand(k)){if(!m.on)return['沒有電力','bad'];if(AKf()[k])return m.act>0?['作動中','ok']:['通電待命','ok'];return['運作中','ok']}
  return['待命','ok']}
function wattOf(m){const k=m.k;if((m.pw||0)>0)return'+'+f1(m.pw);if(!isDemand(k)||(isSw(k)&&m.sw0))return'';if(AKf()[k]&&!(m.act>0))return'待機';return'−'+W0(k)}

// ---------- 電網 ----------
function netOf(d){const L=PW.lks(),seen=new Set([d]),st=[d];
  while(st.length){const x=st.pop();for(const l of L){const y=l[0]==x?l[1]:l[1]==x?l[0]:null;if(y&&!seen.has(y)&&dps.includes(y)){seen.add(y);st.push(y)}}}
  return[...seen]}
function netText(d){const g=d.gs||0,q=d.gd||0,e=d.ge==null?g:d.ge;
  if(q<=0&&g<=0)return['沒有發電也沒有用電','off'];
  if(q<=0)return['發電中，目前沒有用電設備','ok'];
  if(e>=q)return['供電充足','ok'];
  if(e>=q*.5)return['供電偏低（仍可運作）','warn'];
  return['供電不足，設備會停擺','bad']}

// ---------- 通用控制 ----------
const swAct=d=>isSw(d.k)?{id:'sw',t:(d.sw0?'開啟 ':'關閉 ')+nm(d.k),s:d.sw0?'目前：已關閉':'目前：已開啟',cls:d.sw0?'pri':'',run:()=>PW.toggleSw(d)}:null;
const hpRow=d=>d.mh?['耐久',Math.ceil(d.hp)+' / '+d.mh,d.hp/d.mh]:null;

function addFuel(d,k){const F={coal:['coal',1,120],char:['char',1,80],wood:['wood',4,40]}[k];
  if(!F||(inv[F[0]]||0)<F[1]){toast('材料不足');return}
  inv[F[0]]-=F[1];d.fu=(d.fu||0)+F[2];
  nt('gf',[[+d.x.toFixed(2),+d.z.toFixed(2),Math.round(d.fu)]]);
  toast('燃料可運轉 '+Math.ceil(d.fu)+' 秒');hbar()}

// ---------- 各電器內容表 ----------
const REG={};
const lampLike={rows:d=>[['耗電',W0(d.k)+' 單位']],acts:d=>[swAct(d)],note:'關閉後不耗電；沒有電力時會自動停擺。'};
for(const k of['lamp','fan','heater','tv','radio'])REG[k]=lampLike;
REG.wind={rows:d=>[['發電量',f1(d.pw)+' 單位',(d.pw||0)/3.6]],note:'沒有開關，依風況自動發電，接上電線即可供電。'};
REG.solar={rows:d=>[['發電量',f1(d.pw)+' / 2.5 單位',(d.pw||0)/2.5]],note:'沒有開關，白天發電、夜晚停止。'};
REG.pbox={rows:d=>[['接線口',PW.deg(d)+' / 6',PW.deg(d)/6]],note:'把多個設備併成同一個電網，本身不發電也不耗電。'};
REG.gen={rows:d=>[['輸出',f1(d.pw)+' / 8.0 單位',(d.pw||0)/8],['燃料',d.fu>0?Math.ceil(d.fu)+' 秒':'空',Math.min(1,(d.fu||0)/600)]],
  acts:d=>[swAct(d),...[['coal','煤炭',120,1],['char','木炭',80,1],['wood','木材',40,4]].map(([k,n,s,c])=>({id:'f_'+k,t:'加入'+n+(c>1?' ×'+c:''),s:'+'+s+' 秒・持有 '+(inv[k]||0),dis:(inv[k]||0)<c,run:()=>addFuel(d,k)}))],
  note:'燃料燒完會停止發電；關閉時不消耗燃料。'};
REG.purif={rows:d=>[['耗電','2 單位'],['海水',inv.sw||0],['淨水',inv.fw||0]],
  acts:d=>[swAct(d),{id:'pu',t:'淨化海水',s:!d.on?'沒有電力':(inv.sw>0?'持有 '+inv.sw+' 單位海水':'背包沒有海水'),dis:!d.on||!(inv.sw>0),run:()=>{const n=inv.sw;if(!(n>0))return;inv.fw+=n;inv.sw=0;toast('+'+n+' 淨水');hbar()}}],
  note:'把背包裡的海水一次淨化成可飲用的水。'};
const batMode=d=>{const g=d.gs||0,q=d.gd||0,c=BC();return g>q&&(d.fu||0)<c-.5?'充電中':q>g&&(d.fu||0)>.5?'放電中':'待機'};
REG.bat={rows:d=>[['電量',Math.round((d.fu||0)/BC()*100)+'%（'+Math.round(d.fu||0)+' / '+BC()+'）',(d.fu||0)/BC()],['最大輸出',BRt()+' 單位／秒'],['狀態',batMode(d)]],note:'電力有剩時自動充電，不足時放電補上，夜晚與無風時很有用。'};
REG.chgr={rows:d=>[['耗電','2 單位（充電時）'],['空電池',inv.cell||0],['滿電電池',inv.cellf||0],['充電進度',Math.round(Math.min(1,(d.ch||0)/6)*100)+'%',Math.min(1,(d.ch||0)/6)]],acts:d=>[swAct(d)],note:'靠近時會把背包裡的空電池充滿，也能替附近的電動載具充電。'};
REG.efence={rows:d=>[['耗電','1 單位（有敵人時）'],['傷害','16 ／ 0.4 秒'],['範圍','1.7 格']],acts:d=>[swAct(d)],note:'關閉後不會電擊；通電時靠近的殭屍與野狼會被持續電擊。'};
const turRows=d=>{const T=TDf()[d.k];if(!T)return[];const r=[];
  if(T.am)r.push(['彈藥',Math.round(d.fu||0)+' / '+T.mx,(d.fu||0)/T.mx]);
  r.push(['傷害',T.d+(T.n?' ×'+T.n+' 目標':'')],['射速','每 '+T.cd+' 秒'],['射程',T.r+' 格']);
  if(T.pw)r.push(['耗電',T.pw+' 單位（有目標時）']);return r};
const turActs=d=>{const T=TDf()[d.k],a=[];if(isSw(d.k))a.push(swAct(d));
  if(T&&T.am&&J5().load){const have=(inv[T.am]||0)+(T.am=='arrow'?(inv.iarrow||0):0),full=(d.fu||0)>=T.mx;
    a.push({id:'ld',t:'補滿彈藥（'+nm(T.am)+'）',s:full?'彈藥已滿':'背包有 '+have+' 發',dis:full||have<=0,run:()=>J5().load(d,T,T.am)})}
  return a};
for(const k of['tur1','tur2','tur3','tur4'])REG[k]={rows:turRows,acts:turActs,note:k=='tur1'?'不需要電力，只要有彈藥就會自動攻擊。':'自動攻擊射程內的殭屍與野狼。'};

// ---------- 組出面板內容 ----------
function spec(d){
  const R=REG[d.k]||{},sp={rows:[],acts:[],note:R.note||(DS[d.k]||DX[d.k]||''),net:null,wires:[],st:stateOf(d)};
  const h=hpRow(d);if(R.rows)sp.rows.push(...R.rows(d));if(h)sp.rows.push(h);
  let a=R.acts?R.acts(d):(isSw(d.k)?[swAct(d)]:[]);sp.acts=a.filter(Boolean);
  if(PW.PWK.includes(d.k)){
    const L=PW.lks(),mine=L.filter(l=>l[0]==d||l[1]==d),mem=netOf(d).filter(m=>m!==d),cap=d.k=='pbox'?6:2,ns=netText(d);
    sp.net={rows:[['發電',f1(d.gs)+' 單位'],['用電',f1(d.gd)+' 單位'],...((d.ge||0)>(d.gs||0)+.01?[['電池輔助','+'+f1((d.ge||0)-(d.gs||0))+' 單位']]:[]),['電網狀態',ns[0],null,ns[1]]],
      mem:mem.slice(0,8).map((m,i)=>({id:'m'+i,k:m.k,st:stateOf(m),w:wattOf(m)})),more:Math.max(0,mem.length-8),cap,deg:mine.length};
    sp.wires=mine.map((l,i)=>{const o=l[0]==d?l[1]:l[0];return{id:'w'+i,name:nm(o.k),dist:Math.hypot(o.x-d.x,o.z-d.z),n:l[2],run:()=>PW.delLK(l)}})}
  return sp}
const colorOf=c=>c||'off';
function sigOf(d,sp){return JSON.stringify([d.k,sp.note,sp.rows.map(r=>[r[0],r[2]!=null]),sp.acts.map(a=>[a.id,a.t,a.s,!!a.dis,a.cls||'']),
  sp.net&&[sp.net.rows.map(r=>r[0]),sp.net.mem.map(m=>m.k),sp.net.more,sp.net.cap,sp.net.deg],sp.wires.map(w=>[w.id,w.name,Math.round(w.dist*10),w.n])])}
function build(d,sp){
  let h=`<div class=dvc><div class=dvh>${ico(d.k,44)}<div class=nm><b>${esc(nm(d.k))}</b><span class=dvs data-bs=st><i></i><u data-bv=st></u></span></div><div class=dvx data-a=close>${ico('x',16)}</div></div><div class=dvb2>`;
  if(sp.rows.length)h+='<div class=dvsec>'+sp.rows.map((r,i)=>`<div class=dvr><span>${esc(r[0])}</span>${r[2]!=null?`<div class=dvbar><i data-bp=r${i}></i></div>`:''}<span class=dvv data-bv=r${i}></span></div>`).join('')+'</div>';
  if(sp.acts.length)h+='<div class=dvsec><h4>控制</h4><div class=dvag>'+sp.acts.map(a=>`<div class="dvbt${a.cls?' '+a.cls:''}${a.dis?' dis':''}" data-a=${a.id}><b>${esc(a.t)}</b>${a.s?`<small>${esc(a.s)}</small>`:''}</div>`).join('')+'</div></div>';
  else if(isDev(d)&&!isSw(d.k)&&PW.PWK.includes(d.k))h+='<div class=dvsec><h4>控制</h4><div class=dvd>這個設備沒有開關，不需要操作。</div></div>';
  if(sp.net){h+='<div class=dvsec><h4>電網</h4>'+sp.net.rows.map((r,i)=>`<div class=dvr><span>${esc(r[0])}</span><span class=dvv data-bv=n${i}></span></div>`).join('');
    h+=sp.net.mem.map((m,i)=>`<div class=dvm2>${ico(m.k,22)}<span class=n>${esc(nm(m.k))}</span><span class=v data-bv=m${i}></span></div>`).join('');
    if(sp.net.more)h+=`<div class=dvd>…另有 ${sp.net.more} 個設備</div>`;
    if(!sp.net.mem.length)h+='<div class=dvd>這個電網只有它自己。</div>';h+='</div>'}
  if(sp.net){h+=`<div class=dvsec><h4>電線 ${sp.net.deg} / ${sp.net.cap}</h4>`;
    if(!sp.wires.length)h+='<div class=dvd>尚未接線。手持銅線，對準設備點擊即可接線。</div>';
    h+=sp.wires.map(w=>`<div class=dvw><span class=n>連到 ${esc(w.name)}（${f1(w.dist)} 格・${w.n} 條線）</span><div class="dvbt warn" data-a=${w.id}><b>拆除</b></div></div>`).join('')+'</div>'}
  if(sp.note)h+=`<p class=dvd>${esc(sp.note)}</p>`;
  return h+'</div></div>'}
function values(d,sp){const V={st:{t:sp.st[0],c:sp.st[1]}};
  sp.rows.forEach((r,i)=>{V['r'+i]={t:String(r[1]),p:r[2]}});
  if(sp.net){sp.net.rows.forEach((r,i)=>{V['n'+i]={t:String(r[1]),c:r[3]}});sp.net.mem.forEach((m,i)=>{V['m'+i]={t:m.st[0]+(m.w?' ・ '+m.w:''),c:m.st[1]}})}
  return V}

// ---------- 視窗 ----------
const root=document.createElement('div');root.id='dvm';root.className='f u hid';document.body.appendChild(root);
const S={d:null,sig:'',act:{},iv:0,els:null};
function cache(){S.els={v:[...root.querySelectorAll('[data-bv]')],p:[...root.querySelectorAll('[data-bp]')],s:[...root.querySelectorAll('[data-bs]')]}}
function paint(V){if(!S.els)return;
  for(const e of S.els.v){const v=V[e.dataset.bv];if(!v)continue;if(e.textContent!==v.t)e.textContent=v.t;const c=v.c==null?'':colorOf(v.c);if(e.dataset.c!==c){if(c)e.dataset.c=c;else delete e.dataset.c}}
  for(const e of S.els.p){const v=V[e.dataset.bp];if(!v||v.p==null)continue;const w=Math.max(0,Math.min(1,+v.p||0))*100+'%';if(e.style.width!==w)e.style.width=w}
  for(const e of S.els.s){const v=V[e.dataset.bs];if(v){const c='dvs '+colorOf(v.c);if(e.className!==c)e.className=c}}}
function tick(){const d=S.d;if(!d)return;
  let pn=true;try{pn=Q('pn').classList.contains('hid')}catch(e){}
  if(!dps.includes(d)||dead||Math.hypot(P.x-d.x,P.z-d.z)>9||!pn||stS){closeP();return}
  let sp;try{sp=spec(d)}catch(e){console.warn('[DEVPANEL]',e);closeP();return}
  const sig=sigOf(d,sp);
  if(sig!==S.sig){S.sig=sig;root.innerHTML=build(d,sp);cache()}
  S.act={};for(const a of sp.acts)S.act[a.id]=a.run;sp.wires.forEach(w=>{S.act[w.id]=w.run});
  paint(values(d,sp))}
function openP(d){if(!HAS||!isDev(d)||!dps.includes(d)||dead)return;
  S.d=d;S.sig='';S.els=null;
  try{atk=false;kx=ky=0;jv.x=jv.y=0;P.jmp=0}catch(e){}
  try{document.exitPointerLock&&document.exitPointerLock()}catch(e){}
  root.classList.remove('hid');tick();clearInterval(S.iv);S.iv=setInterval(tick,250)}
function closeP(){S.d=null;clearInterval(S.iv);root.classList.add('hid');root.innerHTML='';S.sig='';S.els=null}
root.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){if(e.target===root)closeP();return}
  const a=t.dataset.a;if(a=='close'){closeP();return}
  if(t.classList.contains('dis'))return;
  const f=S.act[a];if(f){try{f()}catch(er){console.warn('[DEVPANEL]',er)}tick()}});
window.DEVPANEL={reg:(k,o)=>{REG[k]=o},open:openP,close:closeP,isOpen:()=>!!S.d,keys:devKeys};

// ---------- 接上互動：瞄準電器按互動鍵 → 開面板 ----------
if(HAS){
  let fT=0,fD=null;
  const aimDev=()=>{const t=performance.now();if(t-fT<40)return fD;fT=t;fD=null;if(!S.d&&!dead){try{fD=PW.pickDev(4.6,devKeys())}catch(e){}}return fD};
  const c0=window.ctxf;
  window.ctxf=function(){const c=c0();if(c&&c.l=='下車')return c;const d=aimDev();return d?{t:'item',g:{k:d.k,n:1},l:'操作面板'}:c};
  const e0=window.useE;
  window.useE=function(){
    if(S.d){closeP();return}
    if(us||dead)return e0();
    const c=c0();if(c&&c.l=='下車')return e0();
    const d=aimDev();if(d){openP(d);return}
    e0()};
}

// ==================================================================
// [J57b] 左手格（火把）：手持模型、光源、燃燒耐久
//   物品要能拿在左手：IT[k].lh=1（需要有手持模型 parts(k)；要發光就照火把的做法加光源）
// ==================================================================
if(IT.torch)IT.torch.lh=1;
const LHI=EQS.findIndex(q=>q.id=='lhand');
const lhG=new T3.Group,lhM={};lhG.position.set(-.3,-.3,-.58);lhG.rotation.set(-.3,0,-.12);lhG.visible=false;vm.add(lhG);
hb(.1,.11,.13,0xc99c7a,0,0,0,lhG);hb(.125,.125,.07,0x252a25,0,-.03,.09,lhG);hb(.115,.115,.55,0x3d4b3b,0,-.1,.36,lhG).rotation.x=.28;
let lhFl=null;
for(const k of KEYS)if(IT[k]&&IT[k].lh){const m=new T3.Mesh(mg(parts(k)),LV);m.visible=false;lhG.add(m);lhM[k]=m;
  if(k=='torch'){const f=new T3.Group;f.position.y=.38;m.add(f);lhFl=[[0xff6a1a,.07,.26],[0xffd25a,.04,.17]].map(([c,r,h])=>{const q=new T3.Mesh(new T3.ConeGeometry(r,h,6),new T3.MeshBasicMaterial({color:c,transparent:true,opacity:.85,blending:T3.AdditiveBlending,depthWrite:false}));q.position.y=h/2-.02;f.add(q);return q});lhFl.g=f}}
const tl2=new T3.PointLight(0xffa550,0,10,2);sc.add(tl2);
// 多人同步：目前左手拿的物品（J51 的 presence 會讀）
window.__LHK=()=>LHI>=0?(EQP[LHI]||null):null;
// 左手火把燒耐久（手持同一支時由原本的 wear 負責，避免重複扣）
function wearL(dt){if(LHI<0||dead)return;const k=EQP[LHI];if(!k||!MD[k]||cur==k)return;const d=(DUR[k]??MD[k])-dt;DUR[k]=d;if(d>0)return;delete DUR[k];EQP[LHI]=null;toast(NAME(k)+'燒盡了');hbar()}

// ==================================================================
// [J57c] 上車後第三人稱：看得到整台車，視角可轉動
//   駕駛：拖曳畫面＝繞車旋轉鏡頭（不會誤轉方向；停止拖曳 2.5 秒後行駛中會自動回到車後）。乘客：直接用原本的視角操作。
//   原理：update 外層把「這一幀的視角輸入」從 P.yaw / P.pit 拿走改記在 tp 裡；draw() 內的 __CAM3 負責擺鏡頭
// ==================================================================
const tp={mode:null,off:0,op:.32,yE:0,pE:0,idle:0,av:null};
const VXf=()=>window.__VEHX||null;
const FACE={bike:4.6,scoot:4.2,jeep:7,ecar:7};
const u9=window.update;
window.update=function(dt){
  const vx=VXf(),drv=vx?vx.drv():null,pas=vx?vx.pas():null;
  if(drv){
    if(tp.mode!='d'){tp.mode='d';tp.yE=P.yaw;tp.pE=P.pit;tp.off=0;tp.op=.32;tp.idle=0}
    const dy=P.yaw-tp.yE,dp=P.pit-tp.pE;
    if(dy||dp){tp.off+=dy;tp.op=cl(tp.op-dp,-.15,1.3);tp.idle=0;P.yaw=tp.yE;P.pit=tp.pE}
  }else tp.mode=pas?'p':null;
  u9(dt);
  if(drv){
    tp.yE=P.yaw;tp.pE=P.pit;tp.idle+=dt;
    if(tp.idle>2.5&&Math.abs(drv.sp||0)>2){tp.off=Math.atan2(sin(tp.off),cos(tp.off));const k=Math.min(1,dt*2.5);tp.off*=1-k;tp.op+=(.32-tp.op)*k}
  }
  wearL(dt)};
function rider(){if(tp.av)return tp.av;const a=mkH(0x3a6a9a,0xe0b890,.15);a.arms=a.bd.children.filter(c=>c.isGroup&&Math.abs(c.position.y-1.45)<.01);a.g.visible=false;tp.av=a;return a}
const SEATH={bike:.15,jeep:.2,ecar:.2,scoot:.3},DRVOFF={bike:[0,.1],jeep:[-.45,.1],ecar:[-.45,.1],scoot:[0,0]};
window.__CAM3=function(cam,dt){
  const vx=VXf(),drv=vx?vx.drv():null,pas=vx?vx.pas():null,v=drv||pas;
  // 左手格（不論是否搭車都要更新）
  const lk=LHI>=0?EQP[LHI]:null;
  for(const k in lhM)lhM[k].visible=k==lk;
  const fk=.88+.12*sin(time*23)+.08*sin(time*37+1);
  if(lhFl){lhFl.g.scale.set(1,fk,1);lhFl.g.rotation.y=time*3+1;lhFl[0].scale.x=1+.2*sin(time*19+2)}
  lhG.position.y=-.3+sin(time*1.4+1)*.003;
  if(!v||dead){
    if(tp.av&&tp.av.g.visible)tp.av.g.visible=false;
    vm.visible=true;lhG.visible=!!lk&&!dead;
  }else{
    vm.visible=false;
    const D=FACE[v.k]||6,yc=drv?v.yaw+tp.off:P.yaw,op=drv?tp.op:cl(.3-P.pit,-.15,1.3);
    const tx=v.x,ty=v.y+1.25,tz=v.z,hor=Math.cos(op)*D;
    let cx=tx+Math.sin(yc)*hor,cz=tz+Math.cos(yc)*hor,cy=ty+Math.sin(op)*D;
    const gy=gh(cx,cz)+.5;if(cy<gy)cy=gy;
    cam.position.set(cx,cy,cz);cam.lookAt(tx,ty,tz);
    // 駕駛／乘客的小人（坐姿）
    const a=rider(),g=a.g;g.visible=true;
    let px=P.x,pz=P.z;
    if(drv){const o=DRVOFF[v.k]||[0,0];px=v.x+o[0]*Math.cos(v.yaw)+o[1]*Math.sin(v.yaw);pz=v.z-o[0]*Math.sin(v.yaw)+o[1]*Math.cos(v.yaw)}
    g.position.set(px,v.y+(SEATH[v.k]||.2),pz);g.rotation.y=v.yaw+PI;
    const sit=v.k!='scoot';for(const l of a.lg)l.u.rotation.x=sit?-1.45:0;
    for(const ar of a.arms)ar.rotation.x=-1.25;
  }
  // 左手火把的光（跟著鏡頭）
  cam.updateMatrixWorld();
  if(lk=='torch'&&!dead){tl2.position.copy(cam.localToWorld(V(-.3,-.1,-.7)));tl2.intensity=1.6*fk}else tl2.intensity=0;
};

// ---------- 新增內容自檢（F12 主控台自動執行；也可手動輸入 __CHK()） ----------
window.__CHK=function(){const W=[],w=s=>W.push(s);
  try{
    const NMs=k=>NAME(k)||PN[k]||(IT[k]&&IT[k].n);
    for(const r of RC){const k=r[0];
      if(!IC[k])w('配方 '+k+'：沒有圖示 IC['+k+']');
      if(!NMs(k))w('配方 '+k+'：沒有名稱 NX/PN');
      if(!(DS[k]||DX[k]))w('配方 '+k+'：沒有說明 DS/DX');
      const c=ctg(k);if(!Number.isInteger(c)||c<0||c>=CI.length)w('配方 '+k+'：分類 CT['+k+'] 無效（'+c+'），請對照 CI/CIN');}
    for(const r of RC){const k=r[0];if(k in inv&&!RES.includes(k))w('inv.'+k+' 不在 RES：做出來後背包不會顯示')}
    for(const k of KEYS){if(!IT[k])w('KEYS 含 '+k+' 但 IT 沒有定義');else{if(!IC[k])w('物品 '+k+'：沒有圖示');if(IT[k].ar&&!eqAny(k))w('裝備 '+k+'：沒有對應的裝備格');}}
    for(const k in IT){const q=IT[k];if(q.eq&&!EQS.some(s=>s.id==q.eq))w('裝備 '+k+'：裝備格 "'+q.eq+'" 不在 EQS');if(q.lh&&!q.v&&k!='torch')w('左手物品 '+k+'：沒有手持模型 v / parts()')}
    for(const q of EQS)if(!IC[q.ic])w('裝備格 '+q.id+'：缺少底圖圖示 '+q.ic);
    for(const k of NEWK)if(typeof NP[k]!='function')w('建築 '+k+'：缺少模型 NP['+k+']');
    if(PW){for(const k of PW.PWK){if(PW.AH[k]==null)w('電器 '+k+'：缺少電線接點高度 AH');if(!(PN[k]||NAME(k)))w('電器 '+k+'：沒有名稱')}
      for(const k of PW.SWK)if(!PW.PWK.includes(k))w('SWK 含 '+k+' 但它不在 PWK（開關狀態不會存檔/同步）')}
    try{if(typeof window.WILD_SNAP!='function')throw new Error('WILD_SNAP 未匯出');const s=window.WILD_SNAP(),j=JSON.stringify(s);if(!s.eqm)w('存檔 snap() 沒有 eqm（裝備不會存）');if(!Array.isArray(s.po))w('存檔 snap() 沒有 po（放置物不會存）');if(!j||j.length<10)w('存檔 snap() 序列化失敗')}catch(e){w('存檔 snap() 執行錯誤：'+e.message)}
  }catch(e){w('自檢本身出錯：'+e.message)}
  if(W.length)console.warn('[自檢] 發現 '+W.length+' 項待處理：\n- '+W.join('\n- '));else console.info('[自檢] 圖示／名稱／分類／模型／裝備／電器／存檔欄位 檢查通過（多人同步請依檔頭檢查表人工確認）');
  return W};
window.addEventListener('load',()=>setTimeout(()=>{try{window.__CHK()}catch(e){}},2500));
})();
</script>
