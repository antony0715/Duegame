<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>雙屏對戰</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{
 --bg:#10151d;--panel:#1b2430;--panel2:#222e3c;--line:#354454;
 --ink:#edf3f5;--muted:#94a6b4;--accent:#e5a84b;--accent2:#6c9da0;
 --blue:#6fa9d4;--red:#d88b67;--shadow:0 18px 50px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% -20%,#2a3948 0%,#121923 55%,#0c1118 100%);color:var(--ink);
 font-family:ui-sans-serif,system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
 touch-action:none;-webkit-user-select:none;user-select:none}
button,input,textarea{font:inherit}
#menu{display:flex;flex-direction:column;gap:14px;width:min(100%,520px);margin:0 auto;
 padding:calc(26px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));
 height:100%;overflow-y:auto;touch-action:pan-y}
#menu h1{font-size:clamp(30px,7vw,42px);letter-spacing:2px;line-height:1.1;margin:8px 0 0;font-weight:850}
#menu h1:after{content:"";display:block;width:54px;height:4px;margin-top:13px;border-radius:4px;background:var(--accent)}
.brand .eyebrow{margin:10px 0 0;color:#718696;font-size:10px;font-weight:800;letter-spacing:3px}
.brand{padding:5px 0 8px}
#menu>p{color:var(--muted);font-size:13px;line-height:1.7;margin:0}
.row{display:flex;gap:10px}
button{cursor:pointer;border:1px solid rgba(255,255,255,.08);border-radius:13px;
 background:linear-gradient(145deg,#334353,#25313f);color:var(--ink);font-weight:700;
 box-shadow:0 5px 14px rgba(0,0,0,.18);transition:transform .14s,border-color .14s,filter .14s}
button:active{transform:scale(.975);filter:brightness(1.16)}
#menu button{min-height:48px;padding:12px 15px;font-size:15px}
#oh,#og{min-height:62px;font-size:16px;flex:1}
#oh{background:linear-gradient(135deg,#c98c3e,#9b672f);color:#151b20}
#og{background:linear-gradient(135deg,#527f91,#365967)}
#pr,#pj,#ph,#pg{background:rgba(27,36,48,.82);border:1px solid var(--line);border-radius:18px;padding:16px}
#pr p,#pj p,#ph p,#pg p{color:#b5c2cc}
#rc{color:var(--accent);font-weight:900;text-shadow:0 5px 25px rgba(229,168,75,.22)}
input,textarea{width:100%;border:1px solid #465969;border-radius:12px;background:#101923;color:var(--ink);padding:13px}
input{font-size:26px;letter-spacing:8px}
textarea{height:74px;font-size:12px;resize:vertical}
details{border-top:1px solid var(--line);padding-top:8px;color:var(--muted)}
summary{padding:8px 0;cursor:pointer}
#msg{color:var(--accent);font-size:13px;min-height:18px}
#game{display:none;position:fixed;inset:0;width:100%;height:100vh;height:100dvh;background:#0c131c;overflow:hidden}
/* 原始遊戲座標維持 400×600；將畫布順時針旋轉，讓每位玩家看到自己的橫向半場 */
#c{position:absolute;left:50%;top:50%;width:100dvh;height:150dvh;display:block;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center;touch-action:none}
#controls{position:fixed;inset:0;z-index:4;pointer-events:none}
#joyBase{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:clamp(104px,23vw,142px);height:clamp(104px,23vw,142px);border:2px solid rgba(220,235,245,.25);border-radius:50%;background:radial-gradient(circle,rgba(95,125,145,.24),rgba(18,29,40,.72));box-shadow:0 8px 28px #0008;pointer-events:auto;touch-action:none;display:none}
#joyBase:before{content:"";position:absolute;inset:22%;border:1px solid rgba(220,235,245,.13);border-radius:50%}
#joyBase:after{content:'移動';position:absolute;left:50%;bottom:5px;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:#d5e0e5aa;pointer-events:none}
#joyStick{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(145deg,#d8e3e8,#718b9a);border:2px solid rgba(255,255,255,.55);box-shadow:0 5px 15px #0009;pointer-events:none}
#act{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:clamp(68px,15vw,94px);height:clamp(68px,15vw,94px);border-radius:50%;background:linear-gradient(145deg,#e9b65f,#a66b31);color:#17212a;border:2px solid rgba(255,255,255,.5);font-size:14px;font-weight:900;box-shadow:0 7px 22px #0009;pointer-events:auto;display:none;touch-action:none}
#rotateHint{display:none;position:fixed;inset:0;z-index:20;background:#101923ee;color:#f2f5f6;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;font-weight:800;letter-spacing:1px;pointer-events:none}
@media (orientation:portrait){#rotateHint{display:flex}}

.tb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));width:42px;height:42px;padding:0;
 font-size:17px;background:rgba(17,27,37,.78);border:1px solid rgba(255,255,255,.18);
 border-radius:12px;backdrop-filter:blur(12px);z-index:5}
#st{position:fixed;top:calc(17px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;
 font-size:11px;letter-spacing:1.5px;color:#c1ccd4;pointer-events:none;text-transform:uppercase}
#go{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
 min-width:150px;padding:14px 28px;z-index:5;background:linear-gradient(135deg,#e8b45e,#b87835);
 color:#18212a;border:1px solid rgba(255,255,255,.35);font-size:16px;letter-spacing:1px}
#pk{overflow-y:auto;position:fixed;inset:0;display:none;flex-direction:column;gap:14px;
 padding:calc(24px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));
 background:rgba(7,12,18,.94);backdrop-filter:blur(18px);z-index:9}
#pk h2{color:var(--ink);margin:0;text-align:left;font-size:23px;letter-spacing:1px}
#pk h2:after{content:"選擇一款遊戲開始";display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}
#pkg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
#pkg button{position:relative;min-height:66px;text-align:left;padding:12px 12px 12px 50px;
 font-size:15px;background:linear-gradient(145deg,#263544,#1a2632);border:1px solid #35495a}
#pkg button:before{content:attr(data-index);position:absolute;left:13px;top:50%;transform:translateY(-50%);
 width:25px;height:25px;display:grid;place-items:center;border-radius:8px;
 color:#e6b66c;background:#3a3a34;font-size:11px;font-weight:900}
#pkg button[data-g="kitchen"]{grid-column:1/-1;background:linear-gradient(120deg,#66523d,#293d3e);border-color:#8e7958}
#pkg p{grid-column:1/-1;color:#d7b77d!important;text-align:left!important;font-size:11px!important;
 letter-spacing:2px;border-bottom:1px solid #34424e;padding:14px 2px 7px}
#pc{background:#394653!important;min-height:46px}
#tb{z-index:6}
#st{top:calc(9px + env(safe-area-inset-top,0px));font-size:11px;letter-spacing:1px}
#go{bottom:calc(12px + env(safe-area-inset-bottom,0px));min-width:112px;padding:10px 20px}
#pk{padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px));gap:10px}
#pk h2{margin:0!important;text-align:left;font-size:20px}
#pkg{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#pkg button{min-height:52px;font-size:13px;padding:9px 9px 9px 42px}
#pc{margin:0;min-height:42px}
@media(max-height:430px){#pkg{grid-template-columns:repeat(5,minmax(0,1fr))}#pkg button{min-height:44px;font-size:12px}}
@media(min-width:700px){#menu{padding-top:42px}#pkg{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body>
<div id="menu">
  <div class="brand"><h1>雙屏對戰</h1><p class="eyebrow">DUAL SCREEN ARCADE</p></div>
  <p>兩位玩家面對面，各自橫拿一支手機。每人操作自己的畫面，兩個半場同步連線。建議使用相同 Wi-Fi。</p>
  <div class="row" id="pick"><button id="oh">我建立房間</button><button id="og">我加入房間</button></div>
  <div id="pr" style="display:none;flex-direction:column;gap:10px"><p>把這組房間代碼告訴朋友,等他輸入就會自動連線</p><div id="rc" style="font-size:52px;letter-spacing:8px;text-align:center;font-weight:bold">…</div></div>
  <div id="pj" style="display:none;flex-direction:column;gap:10px"><p>輸入朋友手機上的 4 位數房間代碼</p><input id="ci" inputmode="numeric" maxlength="4" placeholder="0000"><button id="cj">加入</button></div>
  <details id="mu"><summary>連不上?改用手動配對</summary><div class="row"><button id="bh">手動建立</button><button id="bg">手動加入</button></div></details>
  <div id="ph" style="display:none;flex-direction:column;gap:10px">
    <p>① 複製代碼傳給朋友</p><textarea id="o" readonly placeholder="產生中…"></textarea><button class="cp" data-t="o">複製代碼</button>
    <p>② 貼上朋友回傳的代碼</p><textarea id="a" placeholder="貼上回覆碼"></textarea><button id="cn">連線</button>
  </div>
  <div id="pg" style="display:none;flex-direction:column;gap:10px">
    <p>① 貼上朋友傳來的代碼</p><textarea id="o2" placeholder="貼上代碼"></textarea><button id="mk">產生回覆碼</button>
    <p>② 複製回覆碼傳給朋友</p><textarea id="a2" readonly></textarea><button class="cp" data-t="a2">複製回覆碼</button>
  </div>
  <p id="msg"></p>
</div>
<div id="game">
  <canvas id="c" width="400" height="600"></canvas><div id="st"></div><div id="controls"><div id="joyBase"><div id="joyStick"></div></div><button id="act">動作</button></div><div id="rotateHint">請將手機旋轉為橫向使用</div>
  <button class="tb" id="ex" style="left:8px">✕</button>
  <button class="tb" id="mn" style="left:60px">☰</button>
  <button class="tb" id="fs" style="right:8px;display:none">⛶</button>
  <button id="go">開始</button>
  <div id="pk"><h2>選一個遊戲</h2>
    <div id="pkg"><button data-index="01" data-g="pong">乒乓對決</button><button data-index="02" data-g="hockey">冰球競技</button>
    <button data-index="03" data-g="tank">坦克砲戰</button><button data-index="04" data-g="snake">雙人貪食蛇</button>
    <button data-index="05" data-g="plane">空戰對決</button><button data-index="06" data-g="bomb">爆破競技</button>
    <button data-index="07" data-g="brick">合作打磚塊</button><button data-index="08" data-g="tug">力量拔河</button>
    <button data-index="09" data-g="sumo">相撲擂台</button><button data-index="10" data-g="mole">打地鼠大賽</button><button data-index="11" data-g="space">太空防線</button>
    <button data-index="12" data-g="td">塔防對戰</button><button data-index="13" data-g="rts">星球爭奪</button>
    <button data-index="14" data-g="royal">皇室對戰</button><button data-index="15" data-g="duel">卡牌決鬥</button>
    <button data-index="16" data-g="flap">雙鳥穿管</button><button data-index="17" data-g="catch">搶接物資</button>
    <button data-index="18" data-g="c4">跨屏四子棋</button><button data-index="19" data-g="mem">記憶翻牌</button>
    <button data-index="20" data-g="beat">節奏對決</button><button data-index="21" data-g="paint">領地爭奪</button>
    <button data-index="22" data-g="react">反應競賽</button>
    <p style="grid-column:1/-1;color:#9aa3b8;font-size:13px;text-align:center">策略棋類</p>
    <button data-index="23" data-g="oth">黑白棋</button><button data-index="24" data-g="chk">跳棋</button>
    <button data-index="25" data-g="ship">海戰棋</button><button data-index="26" data-g="dots">點格棋</button>
    <p style="grid-column:1/-1;color:#9aa3b8;font-size:13px;text-align:center">雙人合作</p>
    <button data-index="27" data-g="kitchen" style="grid-column:1/-1">雙人廚房</button></div>
    <button id="pc" style="background:#444">關閉</button></div>
</div>
<script>
const W=400,H=600,FW=800,$=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let PT=[],shake=0,cdEnd=0,AC=null;
const beep=(f,d=.08)=>{try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
document.addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}});
function fx(k,x,y){const C={hit:['#fff',6,260,520],goal:['#ffd43b',30,360,300],boom:['#ff922b',24,420,140],pop:['#69db7c',10,200,700],die:['#ff6b6b',34,420,110]}[k]||['#fff',8,240,400];
 for(let i=0;i<C[1];i++){const a=Math.random()*6.28,v=C[2]*Math.random();PT.push([x,y,Math.cos(a)*v,Math.sin(a)*v,.5,C[0]])}
 if(k==='goal'||k==='boom'||k==='die')shake=k==='goal'?10:7;beep(C[3],k==='hit'||k==='pop'?.05:.18);if(navigator.vibrate&&(k==='goal'||k==='die'))navigator.vibrate(40)}
const ev=(k,x,y)=>{fx(k,x,y);send({t:'ev',k,x,y})};
function startCount(){cdEnd=performance.now()+2400;beep(440,.1)}
function goHost(){send({t:'cd'});startCount();setTimeout(()=>cur&&cur.start(),2400)}
let side,pc,dc,G={},cid=null,cur=null,host=false,off=0,last=0,acc=0,sw={};
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- 連線(短代碼) ---------- */
const cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const enc=o=>btoa(JSON.stringify(o)),dec=t=>JSON.parse(atob(t.replace(/\s/g,'')));
const say=t=>$('msg').textContent=t;
let P=null;
const send=o=>{if(P){P.open&&P.send(JSON.stringify(o))}else if(dc&&dc.readyState==='open')dc.send(JSON.stringify(o))};
const hidePick=()=>{$('pick').style.display='none';$('mu').style.display='none'};
function waitIce(){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,3500)})}
function pack(){const s=pc.localDescription.sdp,g=r=>(s.match(r)||[])[1];
  const c=[...s.matchAll(/a=candidate:\S+ 1 udp (\d+) (\S+) (\d+) typ (host|srflx)/g)].map(m=>[+m[1],m[2],+m[3],m[4]=='host'?0:1]).slice(0,4);
  return enc([g(/a=ice-ufrag:(\S+)/),g(/a=ice-pwd:(\S+)/),g(/a=fingerprint:sha-256 (\S+)/).replace(/:/g,''),c])}
function unpack(code,type){const [u,p,f,c]=dec(code);
  const sdp=['v=0','o=- 1 2 IN IP4 127.0.0.1','s=-','t=0 0','a=group:BUNDLE 0','m=application 9 UDP/DTLS/SCTP webrtc-datachannel','c=IN IP4 0.0.0.0','a=ice-ufrag:'+u,'a=ice-pwd:'+p,'a=fingerprint:sha-256 '+f.match(/../g).join(':'),'a=setup:'+(type=='offer'?'actpass':'active'),'a=mid:0','a=sctp-port:5000','a=max-message-size:262144',...c.map((x,i)=>`a=candidate:${i+1} 1 udp ${x[0]} ${x[1]} ${x[2]} typ ${x[3]?'srflx raddr 0.0.0.0 rport 0':'host'}`),'a=end-of-candidates',''].join('\r\n');
  return {type,sdp}}
function setup(ch){dc=ch;dc.onopen=begin;dc.onmessage=e=>onMsg(JSON.parse(e.data));dc.onclose=()=>{$('st').textContent='連線中斷,請按 ✕ 重來'}}
$('bh').onclick=async()=>{side='L';host=true;hidePick();$('ph').style.display='flex';
  pc=new RTCPeerConnection(cfg);setup(pc.createDataChannel('g',{ordered:false,maxRetransmits:0}));
  await pc.setLocalDescription(await pc.createOffer());await waitIce();$('o').value=pack()};
$('cn').onclick=async()=>{try{await pc.setRemoteDescription(unpack($('a').value,'answer'));say('連線中…')}catch(e){say('回覆碼不對,請重新複製')}};
$('bg').onclick=()=>{side='R';off=W;hidePick();$('pg').style.display='flex'};
$('mk').onclick=async()=>{try{pc=new RTCPeerConnection(cfg);pc.ondatachannel=e=>setup(e.channel);
  await pc.setRemoteDescription(unpack($('o2').value,'offer'));await pc.setLocalDescription(await pc.createAnswer());await waitIce();
  $('a2').value=pack();say('把回覆碼傳給朋友,等他按「連線」')}catch(e){say('代碼不對,請重新複製')}};
document.querySelectorAll('.cp').forEach(b=>b.onclick=async()=>{const t=$(b.dataset.t);t.select();
  try{await navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}say('已複製')});

function pjsetup(c){P=c;c.on('open',begin);c.on('data',d=>onMsg(typeof d==='string'?JSON.parse(d):d));c.on('close',()=>{$('st').textContent='連線中斷,請按 ✕ 重來'})}
$('oh').onclick=()=>{if(!window.Peer){say('載入連線元件失敗,請確認網路,或用下方手動配對');return}
  side='L';host=true;hidePick();$('pr').style.display='flex';
  const code=String(Math.floor(1000+Math.random()*9000)),p=new Peer('dsg'+code);
  p.on('open',()=>$('rc').textContent=code);p.on('connection',pjsetup);
  p.on('error',e=>say(e.type==='unavailable-id'?'代碼重複,請重新整理再試':'連線錯誤:'+e.type))};
$('og').onclick=()=>{if(!window.Peer){say('載入連線元件失敗,請確認網路,或用下方手動配對');return}side='R';off=W;hidePick();$('pj').style.display='flex'};
$('cj').onclick=()=>{const code=$('ci').value.trim(),p=new Peer();say('連線中…');
  p.on('open',()=>pjsetup(p.connect('dsg'+code,{reliable:false})));
  p.on('error',e=>say(e.type==='peer-unavailable'?'找不到這個房間代碼':'連線錯誤:'+e.type))};
/* ---------- 流程 ---------- */
let began=false;function begin(){if(began)return;began=true;$('menu').style.display='none';$('game').style.display='block';
  $('st').textContent=host?'主機玩家':'加入玩家';
  if(document.documentElement.requestFullscreen)$('fs').style.display='block';
  if(host){$('pk').style.display='flex';setInterval(()=>cid&&send({t:'st',G}),33)}
  last=performance.now();requestAnimationFrame(loop)}
function setGame(id){cid=id;cur=GAMES[id];cur.init();$('pk').style.display='none';configureControls()}
const JOY_GAMES=new Set(['pong','hockey','tank','snake','plane','bomb','brick','sumo','space','catch','paint','kitchen']);
const ACTION_LABEL={tug:'連點',flap:'跳躍',react:'搶按',bomb:'放置'};
function configureControls(){const show=!!cur&&JOY_GAMES.has(cid);$('joyBase').style.display=show?'block':'none';$('act').style.display=cur&&ACTION_LABEL[cid]?'block':'none';if(cur&&ACTION_LABEL[cid])$('act').textContent=ACTION_LABEL[cid]}

function onMsg(m){
  if(m.t==='st'&&!host){G=m.G}
  else if(m.t==='g'&&!host)setGame(m.g);
  else if(m.t==='in'&&host&&cur)cur.touch('R',m.x,m.y,m.ph);
  else if(m.t==='joyKitchen'&&host&&G.c&&G.c.R){G.c.R.gl=-1;G.c.R.tx=m.x;G.c.R.ty=m.y}
  else if(m.t==='joyKitchenEnd'&&host&&G.c&&G.c.R){G.c.R.tx=-1;G.c.R.gl=-1}
  else if(m.t==='go'&&host&&cur)goHost();
  else if(m.t==='ev')fx(m.k,m.x,m.y);else if(m.t==='cd')startCount()}
document.querySelectorAll('#pk [data-g]').forEach(b=>b.onclick=()=>{setGame(b.dataset.g);send({t:'g',g:cid})});
$('pc').onclick=()=>$('pk').style.display='none';
$('mn').onclick=()=>{if(host)$('pk').style.display='flex';else $('st').textContent='請房主(左屏)按 ☰ 選遊戲'};
$('ex').onclick=()=>location.reload();

/* ---------- 觸控(轉成全場座標) ---------- */
function screenToWorld(clientX,clientY){const r=cv.getBoundingClientRect(),sc=r.height/W;const lx=(clientY-(r.top+r.height/2))/sc+W/2;const ly=-(clientX-(r.left+r.width/2))/sc+H/2;return {x:clamp(lx,0,W)+off,y:clamp(ly,0,H)}}
function dispatchTouch(x,y,ph){if(!cur)return;if(host)cur.touch('L',x,y,ph);else send({t:'in',x,y,ph})}
function pt(e,ph){const t=e.changedTouches?e.changedTouches[0]:e,{x,y}=screenToWorld(t.clientX,t.clientY);dispatchTouch(x,y,ph)}
let down=false;
for(const [n,p] of [['pointerdown','s'],['pointermove','m'],['pointerup','e'],['pointercancel','e']])cv.addEventListener(n,e=>{if(n==='pointermove'&&!down)return;if(n==='pointerdown'){down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}}if(n==='pointerup'||n==='pointercancel')down=false;e.preventDefault();pt(e,p)},{passive:false});

/* ---------- 虛擬搖桿：每支手機只送出自己的玩家輸入 ---------- */
const joy=$('joyBase'),stick=$('joyStick');let joyId=null,joyVec={x:0,y:0},joyActive=false,joyLast=null;
function playerKey(){return host?'L':'R'}
function joystickPoint(){const s=playerKey(),o=s==='L'?0:400;
  if(cid==='tank')return {x:clamp((s==='L'?70:730)+joyVec.y*250,20,780),y:clamp(506-joyVec.x*250,30,570)};
  if(cid==='kitchen'){const c=G.c&&G.c[s]||{x:o+200,y:300};return {x:clamp(c.x+joyVec.y*145,s==='L'?20:420,s==='L'?380:780),y:clamp(c.y-joyVec.x*190,25,490)}}
  if(cid==='sumo'||cid==='paint'){const c=s==='L'?G.a:G.b;return {x:clamp(c.x+joyVec.y*145,s==='L'?20:420,s==='L'?380:780),y:clamp(c.y-joyVec.x*190,20,570)}}
  if(cid==='hockey'||cid==='plane'){const px=cid==='hockey'?(s==='L'?G.ax:G.bx):(s==='L'?G.ax:G.bx),py=cid==='hockey'?(s==='L'?G.ay:G.by):(s==='L'?G.ay:G.by);return {x:clamp(px+joyVec.y*165,s==='L'?28:412,s==='L'?388:772),y:clamp(py-joyVec.x*220,28,572)}}
  if(cid==='pong')return {x:o+200,y:clamp((s==='L'?G.lp:G.rp)-joyVec.x*235,45,555)};
  if(cid==='brick')return {x:o+200,y:clamp((s==='L'?G.pl:G.pr)-joyVec.x*235,62,538)};
  if(cid==='space')return {x:o+200,y:clamp((s==='L'?G.pl:G.pr)-joyVec.x*235,30,570)};
  if(cid==='catch')return {x:clamp(G.x[s]+joyVec.y*165,o+12,o+388),y:300};
  return {x:clamp(o+200+joyVec.y*165,o+12,o+388),y:clamp(300-joyVec.x*235,18,582)};
}
function sendJoy(phase){if(!cur)return;const s=playerKey();
  if(cid==='kitchen'){const c=G.c&&G.c[s];if(c){if(phase==='e'){if(host){c.tx=-1;c.gl=-1}else send({t:'joyKitchenEnd'})}else{const p=joystickPoint();if(host){c.gl=-1;c.tx=p.x;c.ty=p.y}else send({t:'joyKitchen',x:p.x,y:p.y})}}return}
  if(cid==='tank'&&phase==='s'){const p=joystickPoint();dispatchTouch(p.x,p.y,'s');return}
  const p=joystickPoint();dispatchTouch(p.x,p.y,phase);
}
function updateStick(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,d=Math.hypot(dx,dy),k=d>max?max/d:1;joyVec={x:dx*k/max,y:dy*k/max};stick.style.left=`calc(50% + ${joyVec.x*max}px)`;stick.style.top=`calc(50% + ${joyVec.y*max}px)`;sendJoy(joyActive?'m':'s');joyActive=true}
function resetStick(){if(!joyActive)return;sendJoy('e');joyActive=false;joyVec={x:0,y:0};stick.style.left='50%';stick.style.top='50%';joyId=null}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(joyId);joyActive=false;updateStick(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId){e.preventDefault();updateStick(e)}});
joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){e.preventDefault();resetStick()}});
joy.addEventListener('pointercancel',resetStick);
$('act').addEventListener('pointerdown',e=>{e.preventDefault();const s=playerKey(),o=s==='L'?0:400,x=o+200,y=300;if(cid==='bomb'){dispatchTouch(x,y,'s');dispatchTouch(x,y,'e')}else dispatchTouch(x,y,'s')});

const GAMES={};
const txt=(s,x,y,sz,c)=>{ctx.save();ctx.fillStyle=c||'#fff';ctx.font='700 '+sz+'px ui-sans-serif,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.38)';ctx.shadowBlur=4;ctx.shadowOffsetY=2;ctx.translate(x,y);ctx.rotate(-Math.PI/2);ctx.fillText(s,0,0);ctx.restore()};
const circ=(x,y,r,c)=>{ctx.save();ctx.shadowColor='rgba(0,0,0,.32)';ctx.shadowBlur=Math.max(3,r*.25);ctx.shadowOffsetY=3;const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);g.addColorStop(0,'rgba(255,255,255,.32)');g.addColorStop(.28,c);g.addColorStop(1,c);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()};

GAMES.pong={init(){G={bx:400,by:300,vx:0,vy:0,lp:300,rp:300,ls:0,rs:0,run:false,over:0,msg:'先得 5 分獲勝'}},
 chk(){if(G.ls>=5||G.rs>=5){G.over=1;G.msg=(G.ls>=5?'左':'右')+'邊獲勝!'}},
 start(){if(G.over)this.init();const d=Math.random()<.5?-1:1;Object.assign(G,{bx:400,by:300,vx:300*d,vy:(Math.random()*2-1)*180,run:true,msg:''})},
 step(dt){if(!G.run)return;G.bx+=G.vx*dt;G.by+=G.vy*dt;
  if(G.by<8){G.by=8;G.vy=Math.abs(G.vy)}if(G.by>H-8){G.by=H-8;G.vy=-Math.abs(G.vy)}if(!host)return;
  if(G.vx<0&&G.bx<=28&&G.bx>10&&Math.abs(G.by-G.lp)<53){G.vx*=-1.06;G.vy+=(G.by-G.lp)*4;G.bx=28;ev('hit',28,G.by)}
  if(G.vx>0&&G.bx>=FW-28&&G.bx<FW-10&&Math.abs(G.by-G.rp)<53){G.vx*=-1.06;G.vy+=(G.by-G.rp)*4;G.bx=FW-28;ev('hit',FW-28,G.by)}
  if(G.bx<0){G.rs++;G.run=false;ev('goal',0,G.by);this.chk()}if(G.bx>FW){G.ls++;G.run=false;ev('goal',FW,G.by);this.chk()}},
 touch(s,x,y){const v=clamp(y,45,555);if(s==='L')G.lp=v;else G.rp=v},
 draw(){txt(G.ls,360,80,44,'rgba(255,255,255,.25)');txt(G.rs,440,80,44,'rgba(255,255,255,.25)');
  ctx.fillStyle='#f0f0ee';ctx.fillRect(16,G.lp-45,10,90);ctx.fillRect(FW-26,G.rp-45,10,90);circ(G.bx,G.by,10,'#e8590c');if(G.msg)txt(G.msg,400,300,34,'#ffd43b')}};

GAMES.hockey={init(){G={px:400,py:300,vx:0,vy:0,ax:100,ay:300,bx:700,by:300,ls:0,rs:0,run:false,over:0,msg:'先得 5 分獲勝'}},
 chk(){if(G.ls>=5||G.rs>=5){G.over=1;G.msg=(G.ls>=5?'左':'右')+'邊獲勝!'}},
 start(){if(G.over)this.init();const d=Math.random()<.5?-1:1;Object.assign(G,{px:400,py:300,vx:260*d,vy:(Math.random()*2-1)*160,run:true,msg:''})},
 step(dt){if(!G.run)return;G.px+=G.vx*dt;G.py+=G.vy*dt;if(!host)return;
  const f=Math.pow(.85,dt);G.vx*=f;G.vy*=f;
  if(G.py<14){G.py=14;G.vy=Math.abs(G.vy)}if(G.py>H-14){G.py=H-14;G.vy=-Math.abs(G.vy)}
  const gl=Math.abs(G.py-300)<85;
  if(G.px<14){if(gl&&G.px<-10){G.rs++;G.run=false;ev('goal',0,G.py);this.chk()}else if(!gl){G.px=14;G.vx=Math.abs(G.vx)}}
  if(G.px>FW-14){if(gl&&G.px>FW+10){G.ls++;G.run=false;ev('goal',FW,G.py);this.chk()}else if(!gl){G.px=FW-14;G.vx=-Math.abs(G.vx)}}
  for(const [mx,my] of [[G.ax,G.ay],[G.bx,G.by]]){const dx=G.px-mx,dy=G.py-my,d=Math.hypot(dx,dy);
   if(d<42&&d>0){const sp=clamp(Math.hypot(G.vx,G.vy)*1.05,380,850);G.vx=dx/d*sp;G.vy=dy/d*sp;G.px=mx+dx/d*43;G.py=my+dy/d*43;ev('hit',G.px,G.py)}}},
 touch(s,x,y){const yy=clamp(y,28,572);if(s==='L'){G.ax=clamp(x,28,388);G.ay=yy}else{G.bx=clamp(x,412,772);G.by=yy}},
 draw(){ctx.fillStyle='#0f3b3b';ctx.fillRect(0,0,FW,H);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=3;ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(400,0);ctx.lineTo(400,H);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#e8590c';ctx.beginPath();ctx.moveTo(2,215);ctx.lineTo(2,385);ctx.moveTo(FW-2,215);ctx.lineTo(FW-2,385);ctx.stroke();
  txt(G.ls,360,80,44,'rgba(255,255,255,.25)');txt(G.rs,440,80,44,'rgba(255,255,255,.25)');
  circ(G.ax,G.ay,28,'#4dabf7');circ(G.bx,G.by,28,'#ffa94d');circ(G.px,G.py,14,'#fff');if(G.msg)txt(G.msg,400,300,34,'#ffd43b')}};

const GY=520,TX={L:70,R:730};
GAMES.tank={init(){G={hl:3,hr:3,turn:'L',sh:null,aim:null,run:false,msg:'拖曳手指瞄準,放開發射',wh:120+Math.random()*130}},
 start(){this.init();G.run=true},
 end(){G.sh=null;G.aim=null;if(G.hl<=0||G.hr<=0){G.run=false;G.msg=(G.hl<=0?'右':'左')+'邊獲勝!'}else G.turn=G.turn==='L'?'R':'L'},
 step(dt){const s=G.sh;if(!s)return;s.vy+=600*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(!host)return;
  const t=G.turn==='L'?'R':'L';
  if(Math.hypot(s.x-TX[t],s.y-(GY-14))<30){if(t==='L')G.hl--;else G.hr--;ev('boom',s.x,s.y);this.end()}
  else if(s.y>GY||s.x<-20||s.x>FW+20||(s.x>380&&s.x<420&&s.y>GY-G.wh)){ev('boom',clamp(s.x,0,FW),Math.min(s.y,GY));this.end()}},
 touch(s,x,y,ph){if(!G.run||G.sh||s!==G.turn)return;const tx=TX[s],dx=x-tx,dy=y-(GY-14),d=Math.hypot(dx,dy)||1;
  if(ph==='e'){if(d>30){const v=250+Math.min(1,d/300)*650;G.sh={x:tx,y:GY-24,vx:dx/d*v,vy:dy/d*v}}G.aim=null}
  else G.aim={x:tx+dx/d*Math.min(d,300),y:GY-14+dy/d*Math.min(d,300)}},
 draw(){ctx.fillStyle='#1b2a49';ctx.fillRect(0,0,FW,H);ctx.fillStyle='#2b6a3b';ctx.fillRect(0,GY,FW,H-GY);
  ctx.fillStyle='#6b5b4b';ctx.fillRect(380,GY-G.wh,40,G.wh);
  for(const s of ['L','R']){const x=TX[s];ctx.fillStyle=s==='L'?'#4dabf7':'#ffa94d';ctx.fillRect(x-22,GY-18,44,18);ctx.fillRect(x-10,GY-30,20,12);
   txt('HP '+Math.max(0,s==='L'?G.hl:G.hr),x,GY+40,22,'#ff6b6b')}
  txt((G.turn==='L'?'左':'右')+'邊回合',400,50,26,'rgba(255,255,255,.5)');if(G.msg)txt(G.msg,400,90,18,'#ffd43b');
  if(G.aim&&G.turn){ctx.strokeStyle='#fff';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(TX[G.turn],GY-14);ctx.lineTo(G.aim.x,G.aim.y);ctx.stroke();ctx.setLineDash([])}
  if(G.sh)circ(G.sh.x,G.sh.y,7,'#fff')}};

const CS=20;
GAMES.snake={init(){G={a:[[6,15],[5,15],[4,15]],b:[[33,15],[34,15],[35,15]],da:[1,0],db:[-1,0],na:null,nb:null,f:[20,15],run:false,win:''};acc=0;sw={}},
 start(){this.init();G.run=true},
 step(dt){if(!host||!G.run)return;acc+=dt;if(acc<.11)return;acc=0;
  if(G.na)G.da=G.na;if(G.nb)G.db=G.nb;G.na=G.nb=null;
  const ha=[G.a[0][0]+G.da[0],G.a[0][1]+G.da[1]],hb=[G.b[0][0]+G.db[0],G.b[0][1]+G.db[1]];
  const hit=(h,arr)=>arr.slice(0,-1).some(c=>c[0]===h[0]&&c[1]===h[1]);
  const bad=h=>h[0]<0||h[0]>=40||h[1]<0||h[1]>=30||hit(h,G.a)||hit(h,G.b);
  const da=bad(ha),db=bad(hb)||(ha[0]===hb[0]&&ha[1]===hb[1]);
  if(da||db){ev('die',(da?ha[0]:hb[0])*CS+10,(da?ha[1]:hb[1])*CS+10);G.run=false;G.win=da&&db?'平手':da?'右邊獲勝':'左邊獲勝';return}
  G.a.unshift(ha);G.b.unshift(hb);let ate=false;
  for(const [h,arr] of [[ha,G.a],[hb,G.b]])if(h[0]===G.f[0]&&h[1]===G.f[1])ate=true;else arr.pop();
  if(G.f[0]===ha[0]&&G.f[1]===ha[1]&&G.f[0]===hb[0]&&G.f[1]===hb[1]){}
  if(ate){ev('pop',G.f[0]*CS+10,G.f[1]*CS+10);let f;do{f=[Math.floor(Math.random()*40),Math.floor(Math.random()*30)]}while([...G.a,...G.b].some(c=>c[0]===f[0]&&c[1]===f[1]));G.f=f}},
 touch(s,x,y,ph){if(!G.run)return;if(ph==='s'){sw[s]=[x,y];return}if(ph!=='m'||!sw[s])return;
  const dx=x-sw[s][0],dy=y-sw[s][1];if(Math.hypot(dx,dy)<18)return;sw[s]=[x,y];
  const d=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)],c=s==='L'?G.da:G.db;
  if(d[0]===-c[0]&&d[1]===-c[1])return;if(s==='L')G.na=d;else G.nb=d},
 draw(){ctx.fillStyle='#10201a';ctx.fillRect(0,0,FW,H);
  const dr=(arr,c)=>{ctx.fillStyle=c;arr.forEach(p=>ctx.fillRect(p[0]*CS+1,p[1]*CS+1,CS-2,CS-2))};
  dr(G.a,'#51cf66');dr(G.b,'#ffa94d');circ(G.f[0]*CS+10,G.f[1]*CS+10,8,'#ff6b6b');
  if(G.win)txt(G.win,400,300,40,'#ffd43b')}};

GAMES.plane={init(){G={ax:80,ay:300,bx:720,by:300,hl:5,hr:5,bl:[],ro:[[400,100,90],[400,300,-90],[400,500,90]],ca:0,cb:0,run:false,msg:'手指拖曳移動,自動開火'}},
 start(){this.init();G.run=true;G.msg=''},
 step(dt){G.bl.forEach(b=>b[0]+=b[2]*dt);G.ro.forEach(r=>{r[1]+=r[2]*dt;if(r[1]<40||r[1]>560)r[2]*=-1});
  if(!host||!G.run)return;G.ca-=dt;G.cb-=dt;
  if(G.ca<=0){G.ca=.45;G.bl.push([G.ax+24,G.ay,520])}if(G.cb<=0){G.cb=.45;G.bl.push([G.bx-24,G.by,-520])}
  G.bl=G.bl.filter(b=>{if(b[0]<-20||b[0]>FW+20)return false;if(G.ro.some(r=>Math.hypot(b[0]-r[0],b[1]-r[1])<30))return false;
   if(b[2]>0&&Math.abs(b[0]-G.bx)<22&&Math.abs(b[1]-G.by)<20){G.hr--;ev('hit',b[0],b[1]);return false}
   if(b[2]<0&&Math.abs(b[0]-G.ax)<22&&Math.abs(b[1]-G.ay)<20){G.hl--;ev('hit',b[0],b[1]);return false}return true});
  if(G.hl<=0||G.hr<=0){G.run=false;G.msg=(G.hl<=0?'右':'左')+'邊獲勝!'}},
 touch(s,x,y){const yy=clamp(y,30,570);if(s==='L'){G.ax=clamp(x,30,380);G.ay=yy}else{G.bx=clamp(x,420,770);G.by=yy}},
 draw(){ctx.fillStyle='#14233f';ctx.fillRect(0,0,FW,H);G.ro.forEach(r=>circ(r[0],r[1],30,'#777'));
  for(const [x,y,c,d] of [[G.ax,G.ay,'#4dabf7',1],[G.bx,G.by,'#ffa94d',-1]]){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x+24*d,y);ctx.lineTo(x-18*d,y-18);ctx.lineTo(x-10*d,y);ctx.lineTo(x-18*d,y+18);ctx.fill()}
  ctx.fillStyle='#ffe066';G.bl.forEach(b=>ctx.fillRect(b[0]-6,b[1]-2,12,4));
  txt('HP '+Math.max(0,G.hl),100,40,22,'#ff6b6b');txt('HP '+Math.max(0,G.hr),700,40,22,'#ff6b6b');
  if(G.msg)txt(G.msg,400,300,30,'#ffd43b')}};

const BW=20,BH=15,BC=40;let cd={l:0,r:0},bw={};
GAMES.bomb={init(){const m=[];for(let y=0;y<BH;y++)for(let x=0;x<BW;x++){let v=0;if(x%2&&y%2)v=1;else if(Math.random()<.55&&!((x<3&&y<3)||(x>BW-4&&y>BH-4)))v=2;m.push(v)}
  G={m,l:{x:0,y:0,d:[0,0],a:1},r:{x:BW-1,y:BH-1,d:[0,0],a:1},bm:[],fx:[],run:false,msg:'拖曳移動,點一下放炸彈'};cd={l:0,r:0};bw={}},
 start(){this.init();G.run=true;G.msg=''},
 boom(b){ev('boom',b.x*BC+20,b.y*BC+20);G.fx.push([b.x,b.y,.4]);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])for(let i=1;i<=2;i++){const x=b.x+dx*i,y=b.y+dy*i;if(x<0||x>=BW||y<0||y>=BH)break;const v=G.m[y*BW+x];if(v===1)break;
   G.fx.push([x,y,.4]);const o=G.bm.find(c=>c.x===x&&c.y===y);if(o)o.t=0;if(v===2){G.m[y*BW+x]=0;break}}},
 step(dt){if(!host||!G.run)return;
  for(const k of ['l','r']){const p=G[k];cd[k]-=dt;if(p.a&&(p.d[0]||p.d[1])&&cd[k]<=0){const nx=p.x+p.d[0],ny=p.y+p.d[1];
   if(nx>=0&&nx<BW&&ny>=0&&ny<BH&&G.m[ny*BW+nx]===0&&!G.bm.some(b=>b.x===nx&&b.y===ny)){p.x=nx;p.y=ny;cd[k]=.14}}}
  G.fx.forEach(f=>f[2]-=dt);G.fx=G.fx.filter(f=>f[2]>0);G.bm.forEach(b=>b.t-=dt);
  let q;while((q=G.bm.find(b=>b.t<=0))){G.bm=G.bm.filter(b=>b!==q);this.boom(q)}
  for(const k of ['l','r'])if(G[k].a&&G.fx.some(f=>f[0]===G[k].x&&f[1]===G[k].y)){G[k].a=0;ev('die',G[k].x*BC+20,G[k].y*BC+20)}
  if(!G.l.a||!G.r.a){G.run=false;G.msg=!G.l.a&&!G.r.a?'平手':!G.l.a?'右邊獲勝!':'左邊獲勝!'}},
 touch(s,x,y,ph){if(!G.run)return;const k=s==='L'?'l':'r',p=G[k];
  if(ph==='s'){bw[s]={x,y,mv:0};return}const w=bw[s];if(!w)return;
  if(ph==='m'){const dx=x-w.x,dy=y-w.y;if(Math.hypot(dx,dy)>14){w.mv=1;p.d=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]}else p.d=[0,0]}
  if(ph==='e'){p.d=[0,0];if(!w.mv&&p.a&&G.bm.filter(b=>b.o===k).length<2&&!G.bm.some(b=>b.x===p.x&&b.y===p.y))G.bm.push({x:p.x,y:p.y,t:2,o:k})}},
 draw(){ctx.fillStyle='#1d3326';ctx.fillRect(0,0,FW,H);

/* ---------- 主迴圈 ---------- */
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(cur)cur.step(dt);PT=PT.filter(p=>(p[4]-=dt)>0);PT.forEach(p=>{p[0]+=p[2]*dt;p[1]+=p[3]*dt});shake=Math.max(0,shake-30*dt);
  ctx.fillStyle='#0b1020';ctx.fillRect(0,0,W,H);ctx.lineWidth=2;ctx.setLineDash([]);
  if(cur){ctx.save();ctx.translate(-off+(shake?(Math.random()-.5)*shake:0),shake?(Math.random()-.5)*shake:0);cur.draw();
   // subtle arcade finish: edge vignette, center seam and player-side accents
   const vg=ctx.createLinearGradient(0,0,0,H);vg.addColorStop(0,'rgba(4,9,14,.22)');vg.addColorStop(.18,'rgba(4,9,14,0)');vg.addColorStop(.82,'rgba(4,9,14,0)');vg.addColorStop(1,'rgba(4,9,14,.25)');ctx.fillStyle=vg;ctx.fillRect(0,0,FW,H);
   ctx.fillStyle='rgba(230,238,232,.10)';ctx.fillRect(398,0,4,H);
   ctx.fillStyle='rgba(111,169,212,.5)';ctx.fillRect(0,0,5,H);ctx.fillStyle='rgba(216,139,103,.5)';ctx.fillRect(FW-5,0,5,H);
   ctx.save();ctx.globalAlpha=.035;ctx.strokeStyle='#dce7e4';ctx.lineWidth=1;
   for(let x=40;x<FW;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
   for(let y=40;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(FW,y);ctx.stroke()}
   ctx.restore();
   PT.forEach(p=>{ctx.globalAlpha=Math.min(1,p[4]*2);ctx.fillStyle=p[5];ctx.fillRect(p[0]-2,p[1]-2,5,5)});ctx.globalAlpha=1;
   const rem=Math.ceil((cdEnd-now)/800);if(rem>0&&rem<=3){txt(rem,200,330,140,'rgba(255,255,255,.85)');txt(rem,600,330,140,'rgba(255,255,255,.85)')}
   ctx.restore();
}
  $('go').style.display=cur&&!G.run&&now>cdEnd?'block':'none';
  requestAnimationFrame(loop)}
