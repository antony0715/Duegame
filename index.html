 let rk=1,n=1;const now=performance.now();
 for(const k in RM){const r=RM[k],live=now-r.t<3000;r.g.visible=live;if(!live)continue;n++;if(r.p>pr)rk++;const a=Math.min(1,dt*12);r.x+=(r.tx-r.x)*a;r.z+=(r.tz-r.z)*a;r.h+=ad(r.h,r.th)*a;r.y+=(r.ty-r.y)*a;r.rx+=ad(r.rx,r.trx)*a;r.rz+=ad(r.rz,r.trz)*a;r.g.position.set(r.x,r.y,r.z);r.g.rotation.set(r.rx,r.h,r.rz);
  {const dx=x-r.x,dz=z-r.z,d=Math.hypot(dx,dz),md=4.2;if(d<md&&d>.01&&crashT<=0&&inv<=0&&r.y<1.5){const nx=dx/d,nz=dz/d,ov=md-d;x+=nx*ov*.6;z+=nz*ov*.6;const rv=(vx-r.vx)*nx+(vz-r.vz)*nz;
   if(rv<-16)crash(nx,nz,-rv);else if(rv<0){vx-=nx*rv*.75;vz-=nz*rv*.75;vx*=.97;vz*=.97;h+=Math.sign(Math.sin(h)*nz-Math.cos(h)*nx)*Math.min(.3,-rv*.012);flash=.2;
    if(rv<-3)for(let q=0;q<10;q++)sp(x-nx*2,.8,z-nz*2,(Math.random()-.5)*16+nx*8,Math.random()*6,(Math.random()-.5)*16+nz*8,Math.random()<.5?0xffd060:0xffffff,.35,.3,-.7,1,1)}}}
  if(r.b)sp(r.x-Math.sin(r.h)*2.5,.7,r.z-Math.cos(r.h)*2.5,0,0,0,0xffa030,.3,.6,-.5,1,.9)}
 $('rk').textContent='名次 '+rk+'/'+n}
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);
 if(st==='count'){cd-=dt;const n=Math.ceil(cd-.5);if(n!==lastN){lastN=n;show(n>0?n:'GO!')}if(cd<=.5)st='race'}
 if(crashT>0){crashT-=dt;if(crashT<=0)respawn()}if(inv>0)inv-=dt;

 if(hb&&!hbp&&spd>16&&!off){drifting=true;driftT=0;const kk=Math.sign(steer)||0;if(kk){vl+=kk*spd*.3;h+=kk*.22}vf*=.93;for(let q=0;q<6;q++)sp(x-f[0]*1.5+(Math.random()-.5)*3,.5,z-f[1]*1.5+(Math.random()-.5)*3,(Math.random()-.5)*8,1+Math.random()*2,(Math.random()-.5)*8,0xffffff,.6,.8,2.2,0,.3);flash=.12}

  if(driftT>=.5)show('集氣！');driftT=0;chain=0}

 const k=Math.exp(-(cy>0?.1:1.8)*dt),g2=cy>0?1:Math.exp(-3*dt);vx*=k;vz*=k;wx*=g2;wy*=g2;wz*=g2;car.rotation.x+=wx*dt;car.rotation.z+=wz*dt;h+=wy*dt;
 if(Math.random()<.6)sp(x,cy+.8,z,(Math.random()-.5)*4,2,(Math.random()-.5)*4,Math.random()<.4?0xffa030:0xaaaaaa,.5,.5,2,0,.5)}
 else{vx=f2[0]*vf+r2[0]*vl;vz=f2[1]*vf+r2[1]*vl}x+=vx*dt;z+=vz*dt;
 if(boost>0)boost-=dt;if(boost<0)boost=0;
 // track
 let bd=1e9,bi=idx;for(let k=-15;k<=15;k++){const i=(idx+k+N)%N,d=(x-pts[i].x)**2+(z-pts[i].z)**2;if(d<bd){bd=d;bi=i}}
 const pv=idx;idx=bi;let sd=(x-pts[idx].x)*Nm[idx].x+(z-pts[idx].z)*Nm[idx].z;off=Math.abs(sd)>15;
 if(Math.abs(sd)>WALL&&!cr){const sg=Math.sign(sd);x=pts[idx].x+Nm[idx].x*sg*WALL;z=pts[idx].z+Nm[idx].z*sg*WALL;const vn=vx*Nm[idx].x+vz*Nm[idx].z;
  if(vn*sg>20)crash(Nm[idx].x*sg,Nm[idx].z*sg,vn*sg);else if(vn*sg>0){vx-=Nm[idx].x*vn*1.3;vz-=Nm[idx].z*vn*1.3;vx*=.85;vz*=.85;flash=.25;if(chain>0){chain=0;show('撞牆！')}}}

  if(pv>N*.9&&idx<N*.1&&half){half=false;lap++;const lt=tm-lapT;lapT=tm;if(!best||lt<best){best=lt;try{localStorage.setItem('drift_best',best)}catch(e){}$('bs').textContent='最佳 '+fmt(best)}
   if(lap>=3){st='fin';$('ov').style.display='flex';$('ov').innerHTML='<h1>完賽！</h1><p>總時間 '+fmt(tm)+'<br>飄移得分 '+score+'<br>最佳單圈 '+fmt(best)+'</p><button class="go" onclick="again()">再來一次</button>';show('FINISH')}else show('第 '+(lap+1)+' 圈')}}
 const sp2=Math.hypot(vx,vz),rx=x-f2[0]*1.5,rz=z-f2[1]*1.5;
 if(drifting&&!off){if(sa>.1){driftT+=dt;nit=Math.min(100,nit+dt*45);chain+=sp2*dt*(1+driftT)}const tc=tcol(driftT);

   for(let q=0;q<2;q++)sp(wx,.25,wz,-vx*.12+(Math.random()-.5)*14+r2[0]*s*8,1+Math.random()*5,-vz*.12+(Math.random()-.5)*14+r2[1]*s*8,tc,.35,.22,-.7,1,1)}}
 if(boost>0){for(let q=0;q<3;q++){const s=q%2?1:-1;sp(rx+r2[0]*.6*s,.7,rz+r2[1]*.6*s,-vx*.3+(Math.random()-.5)*3,(Math.random()-.5)*2,-vz*.3+(Math.random()-.5)*3,Math.random()<.5?0xff8a1e:0x66ccff,.45,.7,-.5,1,.9)}}
 if(off&&sp2>10&&Math.random()<.6)sp(rx,.4,rz,(Math.random()-.5)*4,2,(Math.random()-.5)*4,0x335533,.6,.6,2);
 upP(dt);flash=Math.max(0,flash-dt);flame.visible=boost>0;flame.scale.set(1.2+Math.random()*.4,1.4+Math.random(),1.2+Math.random()*.4);flame.material.color.setHex(Math.random()<.5?0xffa030:0x66ccff);
 car.position.set(x,cy,z);car.visible=inv<=0||((inv*12|0)%2===0);netTick(dt);car.rotation.y=h;body.rotation.z=THREE.MathUtils.lerp(body.rotation.z,-vl*.02-steer*.05*Math.min(1,sp2/30),Math.min(1,dt*8));

 const va=sp2>8?Math.atan2(vx,vz):h;camA+=ad(camA,cr?va:h+ad(h,va)*.5)*Math.min(1,dt*4);

 R.render(S,C);

 $('bb').style.width=nit+'%';$('fl').style.opacity=Math.max(0,+$('fl').style.opacity-dt*2.5);speedLines(boost>0?1:Math.max(0,(sp2-35)/40)+(drifting?.25:0));$('fx').style.opacity=Math.min(1,boost>0?.9:Math.max(0,(sp2-40)/60));
 const dr=$('dr');if(drifting&&driftT>.3){dr.textContent='飄移 +'+Math.round(chain);dr.style.color='#'+tcol(driftT).toString(16).padStart(6,'0')}else dr.textContent='';
 if(AC&&eo){eo.frequency.value=50+sp2*3.2+(boost>0?40:0);eg.gain.value=mute?0:.05;ng.gain.value=mute||!drifting?0:.07}
}
